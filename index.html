<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>game-tetris</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1 class="title">
      <img class="title-logo" src="assets/bolckfit-logo.png" alt="BlockFit">
    </h1>
    <section class="mobile-status-panel top-status-panel" aria-label="Status">
      <p>
        Score <span id="mobileScore">0</span>
        <span class="sep">|</span>
        Lines <span id="mobileLines">0</span>
        <span class="sep">|</span>
        Level <span id="mobileLevel">1</span>
      </p>
    </section>

    <section class="game-layout">
      <aside class="hold-column">
        <div class="panel hold-panel" id="holdPanel">
          <h2 class="hold-header">HOLD <span id="holdStatus" class="hold-status">LOCKED</span></h2>
          <div class="hold-preview-box">
            <canvas id="hold" width="100" height="100" aria-label="Hold preview"></canvas>
            <span id="holdEmptyText" class="hold-empty-text">EMPTY</span>
          </div>
        </div>
      </aside>

      <div class="board-wrap" id="boardWrap">
        <canvas id="board" width="300" height="600" aria-label="Tetris board"></canvas>
        <div id="scorePopupLayer" class="score-popup-layer" aria-hidden="true"></div>
        <div id="centerActionPanel" class="center-action-panel" aria-label="Main action">
          <button id="btn-start" type="button" class="control-btn btn-start center-action-btn" aria-label="PLAY" title="PLAY"><span class="btn-text">PLAY</span></button>
          <button id="btn-pause" type="button" class="control-btn btn-pause center-action-btn" aria-label="일시정지" title="일시정지"><span class="btn-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h4v16H7V4Zm6 0h4v16h-4V4Z"/></svg></span></button>
          <button id="btn-reset" type="button" class="control-btn btn-reset center-action-btn" aria-label="REPLAY" title="REPLAY"><span class="btn-text">REPLAY</span></button>
        </div>
      </div>

      <aside class="right-column">
        <div class="panel next-panel">
          <h2>NEXT</h2>
          <div class="next-stack">
            <canvas id="next" width="56" height="56" aria-label="Next preview 1"></canvas>
            <canvas id="next2" width="56" height="56" aria-label="Next preview 2"></canvas>
            <canvas id="next3" width="56" height="56" aria-label="Next preview 3"></canvas>
          </div>
        </div>

        <div class="side-panel">
          <div class="panel stats">
            <h2>STATUS</h2>
            <p>Score: <span id="score">0</span></p>
            <p>Lines: <span id="lines">0</span></p>
            <p>Level: <span id="level">1</span></p>
            <p>Time: <span id="time">0s</span></p>
          </div>

          <div class="panel controls keys-panel">
            <h2>KEYS</h2>
            <p>Left / Right: Move</p>
            <p>Down: Soft Drop</p>
            <p>Up: Rotate</p>
            <p>Space: Hard Drop</p>
            <p>C / Shift: Hold</p>
            <p>P: Pause</p>
            <p>R: Restart</p>
          </div>
        </div>
      </aside>
    </section>    <section class="game-controls" aria-label="Game controls">
      <div class="control-row move-row">
        <button id="btn-left" type="button" class="control-btn btn-move btn-left" aria-label="왼쪽 이동" title="왼쪽 이동"><span class="btn-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.8 4.4 6.4 12l9.4 7.6V4.4Z"/></svg></span></button>
        <button id="btn-down" type="button" class="control-btn btn-softdrop" aria-label="빠른 하강" title="빠른 하강"><span class="btn-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 18.5 5.3 10h13.4L12 18.5Z"/></svg></span></button>
        <button id="btn-right" type="button" class="control-btn btn-move btn-right" aria-label="오른쪽 이동" title="오른쪽 이동"><span class="btn-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.2 4.4 17.6 12l-9.4 7.6V4.4Z"/></svg></span></button>
      </div>

      <div class="control-row utility-row">
        <button id="btn-hold" type="button" class="control-btn btn-hold" aria-label="HOLD" title="HOLD"><span class="btn-text">HOLD</span></button>
        <button id="btn-drop" type="button" class="control-btn btn-harddrop" aria-label="즉시낙하" title="즉시낙하"><span class="btn-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.2a1.4 1.4 0 0 1 1.4 1.4v8.3h2.9a1.2 1.2 0 0 1 .9 2l-4.3 5a1.2 1.2 0 0 1-1.8 0l-4.3-5a1.2 1.2 0 0 1 .9-2h2.9V4.6A1.4 1.4 0 0 1 12 3.2Z"/></svg></span></button>
        <button id="btn-rotate" type="button" class="control-btn btn-rotate" aria-label="회전" title="회전"><span class="btn-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5a7 7 0 1 1-6.7 9h2.2A5 5 0 1 0 12 7c-1.3 0-2.5.5-3.4 1.3L11 10H4V3l2.9 2.9A8.9 8.9 0 0 1 12 5Z"/></svg></span></button>
      </div>

    </section>
    <section class="panel sound-settings bottom-sound-panel sound-panel" aria-label="Sound settings">
      <h2>SOUND</h2>
      <label><input type="checkbox" id="sfxToggle"> SFX ON</label>
      <label><input type="checkbox" id="bgmToggle"> BGM ON</label>
      <label for="volume">Master Volume</label>
      <input type="range" id="volume" min="0" max="100" step="1">
    </section>

    <p id="statusText" class="status-text">?쒖옉 踰꾪듉???뚮윭 寃뚯엫???쒖옉?섏꽭??</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
