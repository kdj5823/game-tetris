<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>game-tetris</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1 class="title">game-tetris</h1>

    <section class="game-layout">
      <aside class="hold-column">
        <div class="panel hold-panel" id="holdPanel">
          <h2 class="hold-header">HOLD <span id="holdStatus" class="hold-status">LOCKED</span></h2>
          <div class="hold-preview-box">
            <canvas id="hold" width="100" height="100" aria-label="Hold preview"></canvas>
            <span id="holdEmptyText" class="hold-empty-text">EMPTY</span>
          </div>
        </div>
      </aside>

      <div class="board-wrap" id="boardWrap">
        <canvas id="board" width="300" height="600" aria-label="Tetris board"></canvas>
        <div id="scorePopupLayer" class="score-popup-layer" aria-hidden="true"></div>
      </div>

      <section class="mobile-status-panel" aria-label="Mobile status">
        <p>
          Score <span id="mobileScore">0</span>
          <span class="sep">|</span>
          Lines <span id="mobileLines">0</span>
          <span class="sep">|</span>
          Level <span id="mobileLevel">1</span>
          <span class="sep">|</span>
          Time <span id="mobileTime">0s</span>
        </p>
        <p>
          Combo <span id="mobileCombo">0</span>
          <span class="sep">|</span>
          Last <span id="mobileLastScore">+0</span>
        </p>
      </section>

      <aside class="right-column">
        <div class="panel next-panel">
          <h2>NEXT</h2>
          <canvas id="next" width="100" height="100" aria-label="Next preview"></canvas>
        </div>

        <div class="side-panel">
          <div class="panel stats">
            <h2>STATUS</h2>
            <p>Score: <span id="score">0</span></p>
            <p>Lines: <span id="lines">0</span></p>
            <p>Level: <span id="level">1</span></p>
            <p>Time: <span id="time">0s</span></p>
          </div>

          <div class="panel controls keys-panel">
            <h2>KEYS</h2>
            <p>Left / Right: Move</p>
            <p>Down: Soft Drop</p>
            <p>Up: Rotate</p>
            <p>Space: Hard Drop</p>
            <p>C / Shift: Hold</p>
            <p>P: Pause</p>
            <p>R: Restart</p>
          </div>
        </div>
      </aside>
    </section>    <section class="game-controls" aria-label="Game controls">
      <div class="control-row move-row">
        <button id="btn-left" type="button" class="control-btn btn-move btn-left" aria-label="왼쪽 이동" title="왼쪽 이동"><span class="arrow-icon">◀</span></button>
        <button id="btn-down" type="button" class="control-btn btn-softdrop" aria-label="빠른 하강" title="빠른 하강">▼</button>
        <button id="btn-right" type="button" class="control-btn btn-move btn-right" aria-label="오른쪽 이동" title="오른쪽 이동"><span class="arrow-icon">▶</span></button>
      </div>

      <div class="control-row top-action-row">
        <button id="btn-hold" type="button" class="control-btn btn-hold" aria-label="보관" title="보관">보관</button>
        <button id="btn-rotate" type="button" class="control-btn btn-rotate" aria-label="회전" title="회전">회전</button>
      </div>

      <div class="control-row harddrop-row">
        <button id="btn-drop" type="button" class="control-btn btn-harddrop" aria-label="즉시낙하" title="즉시낙하">즉시낙하</button>
      </div>

      <div class="control-row action-row">
        <button id="btn-start" type="button" class="control-btn btn-start" aria-label="시작" title="시작">시작</button>
        <button id="btn-pause" type="button" class="control-btn btn-pause" aria-label="일시정지" title="일시정지">일시정지</button>
        <button id="btn-reset" type="button" class="control-btn btn-reset" aria-label="다시하기" title="다시하기">다시하기</button>
      </div>
    </section>
    <section class="panel sound-settings bottom-sound-panel sound-panel" aria-label="Sound settings">
      <h2>SOUND</h2>
      <label><input type="checkbox" id="sfxToggle"> SFX ON</label>
      <label><input type="checkbox" id="bgmToggle"> BGM ON</label>
      <label for="volume">Master Volume</label>
      <input type="range" id="volume" min="0" max="100" step="1">
    </section>

    <p id="statusText" class="status-text">?쒖옉 踰꾪듉???뚮윭 寃뚯엫???쒖옉?섏꽭??</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
