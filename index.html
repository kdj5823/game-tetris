<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>game-tetris</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1 class="title">game-tetris</h1>
    <section class="game-layout">
      <aside class="hold-column">
        <div class="panel hold-panel" id="holdPanel">
          <h2 class="hold-header">HOLD <span id="holdStatus" class="hold-status">LOCKED</span></h2>
          <div class="hold-preview-box">
            <canvas id="hold" width="100" height="100" aria-label="Hold 블록 미리보기"></canvas>
          </div>
          <p id="holdEmptyText" class="hold-empty">EMPTY</p>
        </div>
      </aside>

      <div class="board-wrap" id="boardWrap">
        <canvas id="board" width="300" height="600" aria-label="테트리스 게임 보드"></canvas>
        <div id="scorePopupLayer" class="score-popup-layer" aria-hidden="true"></div>
      </div>

      <aside class="side-panel">
        <div class="panel">
          <h2>다음 블록</h2>
          <canvas id="next" width="120" height="120" aria-label="다음 블록 미리보기"></canvas>
        </div>

        <div class="panel stats">
          <h2>상태</h2>
          <p>점수: <span id="score">0</span></p>
          <p>줄 수: <span id="lines">0</span></p>
          <p>레벨: <span id="level">1</span></p>
          <p>시간: <span id="time">0s</span></p>
        </div>

        <div class="panel controls">
          <h2>조작</h2>
          <p>← : 왼쪽 이동</p>
          <p>→ : 오른쪽 이동</p>
          <p>↓ : 빠른 하강</p>
          <p>↑ : 회전</p>
          <p>Space : 즉시 떨어뜨리기</p>
          <p>C / Shift : Hold</p>
          <p>P : 일시정지 / 재개</p>
          <p>R : 재시작</p>
        </div>

        <div class="panel sound-settings">
          <h2>사운드</h2>
          <label><input type="checkbox" id="sfxToggle"> 효과음 ON</label>
          <label><input type="checkbox" id="bgmToggle"> 배경음악 ON</label>
          <label for="volume">전체 음량</label>
          <input type="range" id="volume" min="0" max="100" step="1">
        </div>
      </aside>
    </section>

    <section class="buttons">
      <button id="startBtn" type="button">시작</button>
      <button id="pauseBtn" type="button">일시정지</button>
      <button id="restartBtn" type="button">재시작</button>
    </section>
    <p id="statusText" class="status-text">시작 버튼을 눌러 게임을 시작하세요.</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
